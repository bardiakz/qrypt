id: io.github.bardiakz.Qrypt
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm23
command: qrypt
rename-icon: qrypt_icon
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: liboqs
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DOQS_BUILD_ONLY_LIB=ON
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: git
        url: https://github.com/open-quantum-safe/liboqs.git
        tag: 0.16.0
        commit: 5a1a854b0dc9f2141bdc771c555ee60c37950183
  - name: Qrypt
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm23/bin:/var/lib/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm23/lib
      env:
        PUB_CACHE: /run/build/Qrypt/.pub-cache
    build-commands:
      - setup-flutter.sh
      - flutter build linux --release --no-pub
      - cp -r $BUNDLE_PATH /app/io.github.bardiakz.Qrypt
      - cp -P /app/lib/liboqs.so* /app/io.github.bardiakz.Qrypt/lib/
      - mkdir -p /app/bin && ln -s /app/io.github.bardiakz.Qrypt/qrypt /app/bin/qrypt
      - install -Dm644 data/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 assets/icon/qrypt_icon.png -t /app/share/icons/hicolor/512x512/apps/
    sources:
      - type: git
        url: https://github.com/bardiakz/qrypt.git
        commit: 1d4185cb890d58c068c31c51e7e2d79c8f9bf98a
      - generated/sources/pubspec.json
    modules:
      - generated/modules/flutter-sdk-3.50.0.json

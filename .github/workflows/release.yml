name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release tag name (e.g. v4.5.0; defaults to tag or pubspec.yaml version)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: '29.0.13599879'
  # Optional: set a repository *variable* FLUTTER_VERSION (e.g. 3.35.0) to pin Flutter.
  # Empty = latest on the stable channel.
  FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION }}

jobs:
  verify:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory; skipping."
          fi

  build-android:
    name: Build Android
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Accept Android licenses and install NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # `yes` gets SIGPIPE when sdkmanager exits; ignore that exit code.
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;${NDK_VERSION}"

      - name: Configure Keystore and Gradle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # Adjust Gradle memory limits to fit GitHub-hosted runner memory (7GB)
          sed -i 's/-Xmx8G -XX:MaxMetaspaceSize=4G/-Xmx3G -XX:MaxMetaspaceSize=1G/g' android/gradle.properties

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          elif [ "$IS_TAG" = "true" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing; refusing to publish a tag build signed with a throwaway key."
            exit 1
          elif [ ! -f android/key.properties ]; then
            echo "::warning::No keystore secret; using a throwaway key (test build only)."
            keytool -genkey -v -keystore android/app/upload-keystore.jks \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=qrypt, OU=Release, O=Release, L=Unknown, ST=Unknown, C=US"
            printf "storePassword=android\nkeyPassword=android\nkeyAlias=androiddebugkey\nstoreFile=upload-keystore.jks\n" > android/key.properties
          fi

      - name: Install dependencies
        run: flutter pub get

      # Removed --android-skip-build-dependency-validation so real problems surface.
      - name: Build Android APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Package Android artifacts
        run: |
          mkdir -p android-out
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SRC="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "android-out/qrypt-android-${abi}.apk"
            fi
          done
          cp build/app/outputs/bundle/release/app-release.aab android-out/qrypt-android.aab
          ls -lh android-out

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrypt-android
          path: android-out/*
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config libsecret-1-dev libjsoncpp-dev rpm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux app
        env:
          CFLAGS: "-Wno-error=incompatible-pointer-types"
          CXXFLAGS: "-Wno-error=incompatible-pointer-types"
        run: |
          flutter build linux --release
          if [ -f "liboqs-0.16.0/linux/x86_64/liboqs.so" ]; then
            mkdir -p build/linux/x64/release/bundle/lib
            cp "liboqs-0.16.0/linux/x86_64/liboqs.so" build/linux/x64/release/bundle/lib/
          fi

      - name: Package Linux packages (.tar.gz, .deb, .rpm)
        run: |
          APP_VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "Packaging version: ${APP_VERSION}"

          # 1. Tarball
          tar -czf qrypt-linux-x64.tar.gz -C build/linux/x64/release bundle

          # 2. Debian package (.deb)
          DEB_DIR="deb_staging"
          mkdir -p "$DEB_DIR/opt/qrypt"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/pixmaps"
          mkdir -p "$DEB_DIR/etc/skel/Desktop"
          mkdir -p "$DEB_DIR/DEBIAN"

          cp -r build/linux/x64/release/bundle/* "$DEB_DIR/opt/qrypt/"
          ln -s /opt/qrypt/qrypt "$DEB_DIR/usr/bin/qrypt"
          cp data/io.github.bardiakz.Qrypt.desktop "$DEB_DIR/usr/share/applications/"
          cp data/io.github.bardiakz.Qrypt.desktop "$DEB_DIR/etc/skel/Desktop/qrypt.desktop"

          for size in 16 32 64 128 256 512; do
            mkdir -p "$DEB_DIR/usr/share/icons/hicolor/${size}x${size}/apps"
            src="macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_${size}.png"
            if [ -f "$src" ]; then
              cp "$src" "$DEB_DIR/usr/share/icons/hicolor/${size}x${size}/apps/io.github.bardiakz.Qrypt.png"
              cp "$src" "$DEB_DIR/usr/share/icons/hicolor/${size}x${size}/apps/qrypt.png"
            fi
          done
          cp assets/icon/qrypt_icon.png "$DEB_DIR/usr/share/pixmaps/io.github.bardiakz.Qrypt.png"
          cp assets/icon/qrypt_icon.png "$DEB_DIR/usr/share/pixmaps/qrypt.png"

          cat <<EOF > "$DEB_DIR/DEBIAN/control"
          Package: qrypt
          Version: ${APP_VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: bardiakz <https://github.com/bardiakz>
          Description: High-security encryption, post-quantum key encapsulation, digital signatures, and obfuscation tool.
          Depends: libc6, libgtk-3-0, libglib2.0-0, libsecret-1-0
          EOF
          sed -i 's/^[ \t]*//' "$DEB_DIR/DEBIAN/control"

          cat <<'EOF' > "$DEB_DIR/DEBIAN/postinst"
          #!/bin/sh
          set -e
          if [ -x /usr/bin/update-desktop-database ]; then
            /usr/bin/update-desktop-database -q /usr/share/applications 2>/dev/null || true
          fi
          if [ -x /usr/bin/gtk-update-icon-cache ]; then
            /usr/bin/gtk-update-icon-cache -f -t /usr/share/icons/hicolor 2>/dev/null || true
          fi
          for user_home in /home/*; do
            [ -d "$user_home" ] || continue
            for dt in "Desktop" "desktop" "میزکار"; do
              if [ -d "$user_home/$dt" ]; then
                cp -f /usr/share/applications/io.github.bardiakz.Qrypt.desktop "$user_home/$dt/qrypt.desktop" 2>/dev/null || true
                chmod 755 "$user_home/$dt/qrypt.desktop" 2>/dev/null || true
                user=$(basename "$user_home")
                chown "$user":"$user" "$user_home/$dt/qrypt.desktop" 2>/dev/null || true
              fi
            done
          done
          EOF
          chmod 755 "$DEB_DIR/DEBIAN/postinst"

          cat <<'EOF' > "$DEB_DIR/DEBIAN/postrm"
          #!/bin/sh
          set -e
          if [ -x /usr/bin/update-desktop-database ]; then
            /usr/bin/update-desktop-database -q /usr/share/applications 2>/dev/null || true
          fi
          if [ -x /usr/bin/gtk-update-icon-cache ]; then
            /usr/bin/gtk-update-icon-cache -f -t /usr/share/icons/hicolor 2>/dev/null || true
          fi
          if [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
            for user_home in /home/*; do
              [ -d "$user_home" ] || continue
              for dt in "Desktop" "desktop" "میزکار"; do
                rm -f "$user_home/$dt/qrypt.desktop" 2>/dev/null || true
              done
            done
          fi
          EOF
          chmod 755 "$DEB_DIR/DEBIAN/postrm"

          dpkg-deb --build --root-owner-group "$DEB_DIR" qrypt-linux-amd64.deb
          rm -rf "$DEB_DIR"

          # 3. RPM package (.rpm)
          RPM_TOPDIR="${RUNNER_TEMP:-/tmp}/rpmbuild"
          rm -rf "$RPM_TOPDIR"
          mkdir -p "$RPM_TOPDIR"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          cat <<EOF > "$RPM_TOPDIR/SPECS/qrypt.spec"
          Name:           qrypt
          Version:        ${APP_VERSION}
          Release:        1
          Summary:        High-security encryption and obfuscation tool
          License:        MIT
          AutoReqProv:    no
          Requires:       gtk3, glib2, libsecret

          %define __brp_check_rpaths %{nil}
          %define _build_id_links none

          %description
          Qrypt is a flexible and privacy-first application that allows users to manually
          encrypt, compress, and obfuscate text.

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}/opt/qrypt
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/pixmaps
          mkdir -p %{buildroot}/etc/skel/Desktop

          cp -r ${GITHUB_WORKSPACE}/build/linux/x64/release/bundle/* %{buildroot}/opt/qrypt/
          ln -s /opt/qrypt/qrypt %{buildroot}/usr/bin/qrypt
          cp ${GITHUB_WORKSPACE}/data/io.github.bardiakz.Qrypt.desktop %{buildroot}/usr/share/applications/
          cp ${GITHUB_WORKSPACE}/data/io.github.bardiakz.Qrypt.desktop %{buildroot}/etc/skel/Desktop/qrypt.desktop

          for size in 16 32 64 128 256 512; do
            mkdir -p %{buildroot}/usr/share/icons/hicolor/\${size}x\${size}/apps
            src="${GITHUB_WORKSPACE}/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_\${size}.png"
            if [ -f "\$src" ]; then
              cp "\$src" %{buildroot}/usr/share/icons/hicolor/\${size}x\${size}/apps/io.github.bardiakz.Qrypt.png
              cp "\$src" %{buildroot}/usr/share/icons/hicolor/\${size}x\${size}/apps/qrypt.png
            fi
          done
          cp ${GITHUB_WORKSPACE}/assets/icon/qrypt_icon.png %{buildroot}/usr/share/pixmaps/io.github.bardiakz.Qrypt.png
          cp ${GITHUB_WORKSPACE}/assets/icon/qrypt_icon.png %{buildroot}/usr/share/pixmaps/qrypt.png

          %post
          touch --no-create %{_datadir}/icons/hicolor &>/dev/null || :
          if [ -x /usr/bin/gtk-update-icon-cache ]; then
            /usr/bin/gtk-update-icon-cache -f -t %{_datadir}/icons/hicolor &>/dev/null || :
          fi
          if [ -x /usr/bin/update-desktop-database ]; then
            /usr/bin/update-desktop-database -q /usr/share/applications &>/dev/null || :
          fi
          for user_home in /home/*; do
            [ -d "\$user_home" ] || continue
            for dt in "Desktop" "desktop" "میزکار"; do
              if [ -d "\$user_home/\$dt" ]; then
                cp -f /usr/share/applications/io.github.bardiakz.Qrypt.desktop "\$user_home/\$dt/qrypt.desktop" 2>/dev/null || :
                chmod 755 "\$user_home/\$dt/qrypt.desktop" 2>/dev/null || :
                user=\$(basename "\$user_home")
                chown "\$user":"\$user" "\$user_home/\$dt/qrypt.desktop" 2>/dev/null || :
              fi
            done
          done

          %postun
          touch --no-create %{_datadir}/icons/hicolor &>/dev/null || :
          if [ -x /usr/bin/gtk-update-icon-cache ]; then
            /usr/bin/gtk-update-icon-cache -f -t %{_datadir}/icons/hicolor &>/dev/null || :
          fi
          if [ -x /usr/bin/update-desktop-database ]; then
            /usr/bin/update-desktop-database -q /usr/share/applications &>/dev/null || :
          fi
          if [ "\$1" -eq 0 ]; then
            for user_home in /home/*; do
              [ -d "\$user_home" ] || continue
              for dt in "Desktop" "desktop" "میزکار"; do
                rm -f "\$user_home/\$dt/qrypt.desktop" 2>/dev/null || :
              done
            done
          fi

          %files
          /opt/qrypt
          /usr/bin/qrypt
          /usr/share/applications/io.github.bardiakz.Qrypt.desktop
          /etc/skel/Desktop/qrypt.desktop
          /usr/share/icons/hicolor/*/apps/*.png
          /usr/share/pixmaps/*.png
          EOF
          sed -i 's/^[ \t]*//' "$RPM_TOPDIR/SPECS/qrypt.spec"

          QA_RPATHS=2 rpmbuild --define "_topdir $RPM_TOPDIR" -bb "$RPM_TOPDIR/SPECS/qrypt.spec"
          cp "$RPM_TOPDIR"/RPMS/x86_64/*.rpm qrypt-linux-x86_64.rpm
          rm -rf "$RPM_TOPDIR"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qrypt-linux
          path: |
            qrypt-linux-x64.tar.gz
            qrypt-linux-amd64.deb
            qrypt-linux-x86_64.rpm
          if-no-files-found: error

  build-macos:
    name: Build macOS
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: |
          flutter build macos --release
          APP_NAME=$(ls -d build/macos/Build/Products/Release/*.app 2>/dev/null | head -n 1)
          if [ -d "$APP_NAME" ]; then
            mkdir -p "$APP_NAME/Contents/Frameworks"
            if [ -f "liboqs-0.16.0/macos/arm64/liboqs.dylib" ]; then
              cp "liboqs-0.16.0/macos/arm64/liboqs.dylib" "$APP_NAME/Contents/Frameworks/"
            elif [ -f "liboqs-0.16.0/macos/x86_64/liboqs.dylib" ]; then
              cp "liboqs-0.16.0/macos/x86_64/liboqs.dylib" "$APP_NAME/Contents/Frameworks/"
            fi
          fi

      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          if [ -d "qrypt.app" ]; then
            zip -r -y "${GITHUB_WORKSPACE}/qrypt-macos.zip" qrypt.app
          else
            APP_NAME=$(ls -d *.app | head -n 1)
            zip -r -y "${GITHUB_WORKSPACE}/qrypt-macos.zip" "$APP_NAME"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrypt-macos
          path: qrypt-macos.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: |
          if (Test-Path "liboqs-0.16.0\windows\x86_64\oqs.dll") {
            Copy-Item "liboqs-0.16.0\windows\x86_64\oqs.dll" -Destination "build\windows\x64\runner\Release\" -Force
          }
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "qrypt-windows-x64.zip" -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          }
          $rawVersion = Select-String -Path "pubspec.yaml" -Pattern "^version:\s*(\S+)" | ForEach-Object { $_.Matches.Groups[1].Value.Split('+')[0] }
          if (-not $rawVersion) { $rawVersion = "5.3.3" }
          Write-Host "Building Windows Inno Setup installer for version $rawVersion"
          $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($isccCmd) {
            & iscc /DMyAppVersion="$rawVersion" windows\installer\qrypt_setup.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$rawVersion" windows\installer\qrypt_setup.iss
          } else {
            throw "Inno Setup compiler (ISCC.exe) not found!"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qrypt-windows
          path: |
            qrypt-windows-x64.zip
            qrypt-windows-x64-setup.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-android, build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Determine Release Tag
        id: release_tag
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          else
            APP_VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
            TAG="v${APP_VERSION}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid tag name: $TAG"
            exit 1
          fi
          # Tag must match pubspec.yaml version so builds and release names agree.
          APP_VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          if [ "$TAG" != "v${APP_VERSION}" ]; then
            echo "::warning::Tag $TAG does not match pubspec.yaml version v${APP_VERSION}."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: release-artifacts/*
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
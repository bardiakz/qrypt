name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release tag name (e.g. v4.5.0; defaults to tag or pubspec.yaml version)'
        required: false
        type: string
        default: ''

# Least privilege by default; only the release job gets write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must match the NDK Flutter/Gradle asks for (see "NDK ... not installed" errors).
  NDK_VERSION: '29.0.13599879'

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # FIX: accept SDK licenses and pre-install the NDK so sdkmanager
      # never prompts (and silently skips) during the Gradle build.
      - name: Accept Android licenses and install NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # `yes` gets SIGPIPE when sdkmanager exits; ignore that exit code.
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;${NDK_VERSION}"

      - name: Configure environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Configure Keystore and Gradle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # Adjust Gradle memory limits to fit GitHub-hosted runner memory (7GB)
          sed -i 's/-Xmx8G -XX:MaxMetaspaceSize=4G/-Xmx3G -XX:MaxMetaspaceSize=1G/g' android/gradle.properties

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          elif [ "$IS_TAG" = "true" ]; then
            # A random throwaway key means users can't update over a previous install.
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to publish a tag build signed with a throwaway key."
            exit 1
          elif [ ! -f android/key.properties ]; then
            echo "::warning::No keystore secret; using a throwaway key (test build only)."
            keytool -genkey -v -keystore android/app/upload-keystore.jks \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=qrypt, OU=Release, O=Release, L=Unknown, ST=Unknown, C=US"
            printf "storePassword=android\nkeyPassword=android\nkeyAlias=androiddebugkey\nstoreFile=upload-keystore.jks\n" > android/key.properties
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Package Android artifact
        run: |
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk app-release.apk
          elif [ -f build/app/outputs/apk/release/app-release.apk ]; then
            cp build/app/outputs/apk/release/app-release.apk app-release.apk
          else
            find build/app/outputs -name "*release*.apk" -exec cp {} app-release.apk \;
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrypt-android
          path: app-release.apk
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config libsecret-1-dev libjsoncpp-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux app
        # Set CFLAGS/CXXFLAGS if needed for GCC 14+ strict pointer checks
        env:
          CFLAGS: "-Wno-error=incompatible-pointer-types"
          CXXFLAGS: "-Wno-error=incompatible-pointer-types"
        run: flutter build linux --release

      - name: Package Linux bundle
        run: |
          tar -czf qrypt-linux-x64.tar.gz -C build/linux/x64/release bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrypt-linux
          path: qrypt-linux-x64.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          if [ -d "qrypt.app" ]; then
            zip -r -y "${GITHUB_WORKSPACE}/qrypt-macos.zip" qrypt.app
          else
            APP_NAME=$(ls -d *.app | head -n 1)
            zip -r -y "${GITHUB_WORKSPACE}/qrypt-macos.zip" "$APP_NAME"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrypt-macos
          path: qrypt-macos.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure environment file
        shell: pwsh
        run: |
          if (-not (Test-Path .env)) {
            Copy-Item .env.example .env
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "qrypt-windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrypt-windows
          path: qrypt-windows-x64.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-android, build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh

      # FIX: user input passed via env, not interpolated into the script (injection).
      - name: Determine Release Tag
        id: release_tag
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          else
            APP_VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
            TAG="v${APP_VERSION}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid tag name: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: release-artifacts/*
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true